[versions]
agp = "9.5.2"
# The Kotlin Gradle plugin AGP 9.5 builds with (its built-in Kotlin support); the Compose
# compiler plugin must match it.
kotlin = "2.2.10"
# Library dependencies are the lowest versions the SDK needs, so apps resolve to their own newer ones.
coroutines = "1.9.0"
nine-java = "v0.1.0"
browser = "1.8.0"
# Tests and the example app.
junit = "4.13.2"
robolectric = "4.18.1"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"

[libraries]
nine-java = { module = "com.github.9in-io:java", version.ref = "nine-java" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
